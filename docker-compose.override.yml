services:
  postgres:
    ports: !override
      - "5440:5432"

  backend:
    ports: !override
      - "8082:8080"

  frontend:
    ports: !override
      - "3040:3000"

  camoufox:
    # Production camoufox: only HTTP wrapper. VNC port (5900) is mapped on
    # demand by `docker compose --profile scraping run -p 5900:5900 camoufox`
    # for the login_helper flow.
    ports: !override
      - "3011:3000"
