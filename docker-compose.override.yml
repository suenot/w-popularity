services:
  postgres:
    ports: !override
      - "5440:5432"

  backend:
    ports: !override
      - "8082:8080"
    volumes:
      # Host-built linux/arm64 binary (go.work resolves discord + github-repo
      # parser replaces that the Docker build context can't reach). Rebuild with:
      #   cd backend && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
      #     go build -trimpath -ldflags='-s -w' -o /tmp/w_popularity_api ./cmd/api
      - /tmp/w_popularity_api:/app/api:ro

  frontend:
    ports: !override
      - "3040:3000"

  camoufox:
    # Production camoufox: only HTTP wrapper. VNC port (5900) is mapped on
    # demand by `docker compose --profile scraping run -p 5900:5900 camoufox`
    # for the login_helper flow.
    ports: !override
      - "3011:3000"
